        //顯示分數板主程式
        function show_scoreboard(competition_id)
        {   //區域定義變數
            var round=competition_status[competition_id].Round_Status;//取得比賽回合數
            var pilot_number=competition_status[competition_id].Pilot_Quantity;//取得比賽人數

            //組合顯示用訊息
            var competition_message="";//="比賽人數="+competition_status[competition_id].Pilot_Quantity;
            //competition_message+=", 比賽回合數="+competition_status[competition_id].Round_Status;
            if(competition_status[competition_id].Competition_Status==1)competition_message+="<font color=green>比賽狀態:比賽中</font>";
                else if (competition_status[competition_id].Competition_Status==2)competition_message+="<font color=red>比賽狀態:比賽暫停</font>";
                else competition_message+="<font color=blue>比賽狀態:比賽完成</font>";
            document.getElementById("match_status").innerHTML=competition_message;

            //按照使用者選擇來篩選日期
            var buffer = f3f_record.filter(function(item, index, array){return item.Date == competition_status[competition_id].Date;});
            
            //開始計算成績
            $(buffer).attr("Score");//添加score屬性

            var score=new Array(pilot_number);//宣告陣列儲存每個Round成績用, 第一維飛行員人數
            for(var i=0;i<pilot_number;i++){score[i]=new Array(round);//宣告第二維陣列Round
                    for(var j=0;j<round;j++){score[i][j]=new Array(3);}}//宣告第三維陣列Time/Score/Dudct

            var total_score=new Array(pilot_number);//宣告陣列儲存total成績用, 第一維飛行員人數
            for(var i=0;i<pilot_number;i++){total_score[i]=new Array(8);}//宣告第二維陣列/sequence/total1/rank1/discard1/discard2/deduct/total2/rank2
           
            //計算主迴圈
            for(var j=0;j<round;j++)
            {
                var round_score=buffer.filter(function(item, index, array){return item.Round == j+1;});//篩選回合
                for (var i=0;i<pilot_number;i++)
                {
                    if((round_score[i].Time)==""){round_score[i].Time=8888}//空白填入未飛行代碼8888
                }
                round_score.sort(function (a, b) {return a.Time-b.Time});//排序找出最快的1000分
                var best_time=round_score[0].Time;//計錄回合最短秒數
                round_score.sort(function (a, b) {return a.Sequence-b.Sequence});//回到原排序

                for (var i=0;i<pilot_number;i++)
                {	
                    if(round_score[i].Time==9999){score[i][j][0]="x";score[i][j][1]=0;}//DNF零分
                    else if(round_score[i].Time==7777){score[i][j][0]="-";score[i][j][1]=0;}//DNS零分
                    else if(round_score[i].Time==8888){score[i][j][0]="-";score[i][j][1]=0;}//尚未飛行先填"-"
                    else{score[i][j][0]=round_score[i].Time;score[i][j][1]=best_time/score[i][j][0]*1000;}//開始計算分數,複製Time至score
                    
                    score[i][j][2]=round_score[i].Deduct;//複製Deduct至score
                    
                    total_score[i][0]=i+1;//給定sequence
                    if(isNaN(total_score[i][1])==true){total_score[i][1]=0;}//NaN時給定0初始值
                    total_score[i][1]+=score[i][j][1];//計算total1
                }
            }
            
            var discard_buffer=new Array(round);//計算discard1/discard2使用

            for (var j = 0; j < pilot_number; j++)//計算discard1/discard2
                {	
                    for (var i = 0; i < round; i++)
                        {
                            discard_buffer[i]=score[j][i][1];//存入個人成績
                            if(isNaN(total_score[j][5])==true){total_score[j][5]=0;}//NaN時給定0初始值
                            total_score[j][5]+=score[j][i][2];//計算deduct
                        }
                    discard_buffer.sort(function(a,b) {return a-b});//排序個人成績
                    total_score[j][3]=discard_buffer[0];//存入discard1
                    total_score[j][4]=discard_buffer[1];//存入discard2

                    if(round>14)//計算total2, 超過14回合扣2場, 超過3回合扣1場
                    {
                        total_score[j][6]=total_score[j][1]-total_score[j][3]-total_score[j][4];
                    }
                    else if(round>3)
                    {
                        total_score[j][6]=total_score[j][1]-total_score[j][3];
                    }
                    else
                    {
                        total_score[j][6]=total_score[j][1];
                    }
                }


            total_score.sort(function(a,b) {return a[1]-b[1]});//排序成績
            for (var i = 0; i < pilot_number; i++)//寫入rank1排名
            {
                total_score[i][2]=pilot_number-i;
            }
            total_score.sort(function(a,b) {return a[6]-b[6]});//排序成績
            for (var i = 0; i < pilot_number; i++)//寫入rank2排名
            {
                total_score[i][7]=pilot_number-i;
            }
            total_score.sort(function(a,b) {return a[0]-b[0]});//排回原順序

            //宣告最終輸出Table
            var score_board=new Array(pilot_number);
            for(var i=0;i<pilot_number;i++){score_board[i]=new Array(2+round*3+7);}//宣告第二維陣列(No./Pilot_Name)+Round*(Time/Score/Dudct)+(total1/rank1/discard1/discard2/deduct/total2/rank2)
            
            //開始輸出資料
            for (var i = 0; i < pilot_number; i++)
                {       
                        for (var j = 0; j < round; j++)
                            {
                                round_score = buffer.filter(function(item, index, array){return item.Round == j+1;});//篩選回合

                                if (j==0)
                                    {
                                        score_board[i][0]=round_score[i].Sequence;
                                        score_board[i][1]=round_score[i].Pilot_Name;
                                    }
                                score_board[i][j*3+2]=score[i][j][0];
                                score_board[i][j*3+3]=score[i][j][1].toFixed(2);
                                score_board[i][j*3+4]=score[i][j][2];

                            }
                        score_board[i][(round-1)*3+5]=total_score[i][1].toFixed(2);//total1
                        score_board[i][(round-1)*3+6]=total_score[i][2];//rank1

                        
                        if(round>14)//超過14回合扣除最低2回合成績
                        {
                            score_board[i][(round-1)*3+7]=total_score[i][3].toFixed(2);//discard1
                            score_board[i][(round-1)*3+8]=total_score[i][4].toFixed(2);///discard2
                            score_board[i][(round-1)*3+9]=total_score[i][5];//deduct
                            score_board[i][(round-1)*3+10]=total_score[i][6].toFixed(2);//total2
                            score_board[i][(round-1)*3+11]=total_score[i][7];//rank2
                        }
                        else if(round>3)//超過3回合扣除最低1回合成績
                        {
                            score_board[i][(round-1)*3+7]=total_score[i][3].toFixed(2);//discard1
                            score_board[i][(round-1)*3+8]=total_score[i][5];//deduct
                            score_board[i][(round-1)*3+9]=total_score[i][6].toFixed(2);//total2
                            score_board[i][(round-1)*3+10]=total_score[i][7];//rank2
                        }
                        else//三回合以下不扣除
                        {
                            score_board[i][(round-1)*3+7]=total_score[i][5];//deduct
                            score_board[i][(round-1)*3+8]=total_score[i][6].toFixed(2);//total2
                            score_board[i][(round-1)*3+9]=total_score[i][7];//rank2
                        }

                }

            output_table_header(round);//將表頭輸出到table
            output_table(score_board);//將分數板數據輸出到table
        }

        //將表頭輸出到table
        function output_table_header(round)
        {
            //宣告變數給表頭使用
            var div1 = document.getElementById('table_output');
            //第一行表頭
            var code1 = "";

            code1    += "<tr>";
            code1    += "<th colspan=2>Pilot</th>";
            for (var i = 0; i < round; i++) {code1+="<th colspan=3>Round"+(i+1)+"</th>"};
            code1    += "<th colspan=2>Before adjust</th>"
            if(round>3){code1    += "<th rowspan=2>Discard1</th>"}
            if(round>14){code1    += "<th rowspan=2>Discard2</th>"}
            code1    += "<th rowspan=2>Total<br>Deduct</th>"
            code1    += "<th colspan=2>After adjust</th>"
            code1    += "</tr>"

            //第二行與底行表頭
            var code2 = "";
            code2    += "<tr>"
            for (var i = 0; i < round; i++)
                {
                    if (i==0)
                        {
                            code2    +="<th>No.</th>";
                            code2    +="<th>Name</th>";
                            code2    +="<th>Time</th>";
                            code2    +="<th>Score</th>";
                            code2    +="<th>Deduct</th>";
                        }
                    if (i==round-1)
                        {
                            code2    +="<th>Total</th>";
                            code2    +="<th>Rank</th>";
                            code2    +="<th>Total</th>";
                            code2    +="<th>Rank</th>";
                        }
                    else
                        {
                            code2    +="<th>Time</th>";
                            code2    +="<th>Score</th>";
                            code2    +="<th>Deduct</th>";
                        }
                }
                code2    +="</tr>";

                code1    +="<thead>" + code1 + code2 + "</thead>"+"<tfoot>" + code1 + code2 + "</tfoot>";

            div1.innerHTML = code1;//輸出表頭到table_output
        }

        //將分數板數據輸出到table
        function output_table(score_board)
        {
            //顯示RWD表格
            $(document).ready(function() {
                table = $('#table_output').DataTable( {
                    data: score_board,
                    fixedColumns: { leftColumns: 2 },//凍結兩列
                    "scrollX": true,
                    "scrollY": true,
                    "paging": false,
                    "ordering": true,
                    "info": false,
                } );
            } );
        }

        //重新顯示分數板
        function reload_scoreboard(i)
        {
            var div1 = document.getElementById('table_header');
            table.destroy();//報廢表格DOM
            $('#table_output').empty();//清除輸出區域
            show_scoreboard(i);//重新顯示
        }
